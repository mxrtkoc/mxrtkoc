name: Generate Custom Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # REPOSITORY
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # GENERATE SVG
      # ----------------------------------------------------------

      - name: Generate Snake SVG
        shell: bash
        run: |

          python3 <<'PY'

          import random
          import calendar
          from pathlib import Path


          # ======================================================
          # GITHUB CONTRIBUTION GRID
          # ======================================================

          COLS = 53
          ROWS = 7

          CELL = 14
          SIZE = 10

          LEFT = 32
          TOP = 24

          WIDTH = LEFT + (COLS * CELL) + 8
          HEIGHT = TOP + (ROWS * CELL) + 8


          # ======================================================
          # ANIMATION
          # ======================================================

          FOOD_COUNT = 15
          FRAMES_PER_STEP = 3
          EAT_PAUSE = 5

          random.seed()


          DIRECTIONS = [
              (1, 0),
              (-1, 0),
              (0, 1),
              (0, -1)
          ]


          # ======================================================
          # GRID HELPERS
          # ======================================================

          def neighbors(pos):

              x, y = pos

              result = []

              for dx, dy in DIRECTIONS:

                  nx = x + dx
                  ny = y + dy

                  if (
                      0 <= nx < COLS
                      and
                      0 <= ny < ROWS
                  ):
                      result.append((nx, ny))

              return result


          def choose_food(snake):

              occupied = set(snake)

              possible = []

              for y in range(ROWS):

                  for x in range(COLS):

                      if (x, y) not in occupied:

                          possible.append((x, y))

              return random.choice(possible)


          # ======================================================
          # SNAKE MOVEMENT
          # ======================================================

          def next_step(head, target, snake):

              hx, hy = head
              tx, ty = target

              candidates = []


              # Move toward food horizontally

              if tx > hx:

                  candidates.append((1, 0))

              elif tx < hx:

                  candidates.append((-1, 0))


              # Move toward food vertically

              if ty > hy:

                  candidates.append((0, 1))

              elif ty < hy:

                  candidates.append((0, -1))


              remaining = [
                  d
                  for d in DIRECTIONS
                  if d not in candidates
              ]

              random.shuffle(remaining)

              candidates.extend(remaining)


              tail = snake[-1]


              for dx, dy in candidates:

                  nx = hx + dx
                  ny = hy + dy


                  if not (
                      0 <= nx < COLS
                      and
                      0 <= ny < ROWS
                  ):
                      continue


                  if (
                      (nx, ny) in snake
                      and
                      (nx, ny) != tail
                  ):
                      continue


                  return nx, ny


              valid = neighbors(head)

              if valid:

                  return random.choice(valid)

              return head


          # ======================================================
          # SNAKE SIMULATION
          # ======================================================

          snake = [

              (4, 3),
              (3, 3),
              (2, 3)

          ]


          states = [
              list(snake)
          ]


          food_events = []

          current_frame = 0


          for _ in range(FOOD_COUNT):

              food = choose_food(snake)

              spawn = current_frame

              safety = 0


              while snake[0] != food and safety < 1000:

                  safety += 1


                  new_head = next_step(
                      snake[0],
                      food,
                      snake
                  )


                  snake.insert(
                      0,
                      new_head
                  )


                  # If food not eaten,
                  # remove tail.

                  if new_head != food:

                      snake.pop()


                  for _ in range(FRAMES_PER_STEP):

                      states.append(
                          list(snake)
                      )

                      current_frame += 1


              eat = current_frame


              food_events.append(
                  (
                      spawn,
                      eat,
                      food[0],
                      food[1]
                  )
              )


              # Pause after eating

              for _ in range(EAT_PAUSE):

                  states.append(
                      list(snake)
                  )

                  current_frame += 1


          # Final pause

          for _ in range(20):

              states.append(
                  list(snake)
              )

              current_frame += 1


          TOTAL_FRAMES = len(states)

          DURATION = 30


          KEYTIMES = ";".join(

              f"{i / (TOTAL_FRAMES - 1):.5f}"

              for i in range(TOTAL_FRAMES)

          )


          def values(items):

              return ";".join(
                  str(x)
                  for x in items
              )


          # ======================================================
          # SVG GENERATOR
          # ======================================================

          def generate(theme, filename):


              # --------------------------------------------------
              # COLORS
              # --------------------------------------------------

              if theme == "dark":

                  background = "#0d1117"

                  cell = "#161b22"

                  border = "#30363d"

                  text = "#8b949e"

                  month = "#8b949e"

                  snake_head = "#e9d5ff"

                  snake_body = "#a855f7"

                  snake_dark = "#7e22ce"


              else:

                  background = "#ffffff"

                  cell = "#ebedf0"

                  border = "#d0d7de"

                  text = "#57606a"

                  month = "#57606a"

                  snake_head = "#d8b4fe"

                  snake_body = "#9333ea"

                  snake_dark = "#6b21a8"


              # Food

              food_color = "#22c55e"


              svg = []


              # --------------------------------------------------
              # SVG HEADER
              # --------------------------------------------------

              svg.append(

                  f'<svg '

                  f'viewBox="0 0 {WIDTH} {HEIGHT}" '

                  f'width="{WIDTH}" '

                  f'height="{HEIGHT}" '

                  f'xmlns="http://www.w3.org/2000/svg">'

              )


              svg.append(

                  '<desc>Custom Purple Snake Contribution Animation</desc>'

              )


              # --------------------------------------------------
              # DEFINITIONS
              # --------------------------------------------------

              svg.append("""
              <defs>

                <filter
                  id="glow"
                  x="-100%"
                  y="-100%"
                  width="300%"
                  height="300%"
                >

                  <feGaussianBlur
                    stdDeviation="2"
                    result="blur"
                  />

                  <feMerge>

                    <feMergeNode
                      in="blur"
                    />

                    <feMergeNode
                      in="SourceGraphic"
                    />

                  </feMerge>

                </filter>

              </defs>
              """)


              # --------------------------------------------------
              # BACKGROUND
              # --------------------------------------------------

              svg.append(

                  f'<rect '

                  f'x="0" '

                  f'y="0" '

                  f'width="{WIDTH}" '

                  f'height="{HEIGHT}" '

                  f'rx="8" '

                  f'fill="{background}"/>'

              )


              # ==================================================
              # DAY LABELS
              # ==================================================

              labels = [

                  (1, "Mon"),

                  (3, "Wed"),

                  (5, "Fri")

              ]


              for row, label in labels:

                  y = TOP + row * CELL + 9


                  svg.append(

                      f'<text '

                      f'x="0" '

                      f'y="{y}" '

                      f'font-family="Arial, sans-serif" '

                      f'font-size="9" '

                      f'fill="{text}">'

                      f'{label}'

                      f'</text>'

                  )


              # ==================================================
              # MONTH LABELS
              # ==================================================

              # Approximate GitHub-style month placement

              month_positions = [

                  (0, "Jan"),

                  (4, "Feb"),

                  (8, "Mar"),

                  (13, "Apr"),

                  (17, "May"),

                  (22, "Jun"),

                  (26, "Jul"),

                  (31, "Aug"),

                  (35, "Sep"),

                  (40, "Oct"),

                  (44, "Nov"),

                  (48, "Dec")

              ]


              for column, name in month_positions:

                  x = LEFT + column * CELL


                  svg.append(

                      f'<text '

                      f'x="{x}" '

                      f'y="11" '

                      f'font-family="Arial, sans-serif" '

                      f'font-size="9" '

                      f'fill="{month}">'

                      f'{name}'

                      f'</text>'

                  )


              # ==================================================
              # CONTRIBUTION GRID
              # ==================================================

              for y in range(ROWS):

                  for x in range(COLS):

                      px = LEFT + x * CELL

                      py = TOP + y * CELL


                      svg.append(

                          f'<rect '

                          f'x="{px}" '

                          f'y="{py}" '

                          f'width="{SIZE}" '

                          f'height="{SIZE}" '

                          f'rx="2" '

                          f'fill="{cell}" '

                          f'stroke="{border}" '

                          f'stroke-width="0.4"/>'

                      )


              # ==================================================
              # FOOD
              # ==================================================

              for spawn, eat, fx, fy in food_events:


                  px = LEFT + fx * CELL

                  py = TOP + fy * CELL


                  opacity = []


                  for frame in range(TOTAL_FRAMES):

                      if spawn <= frame < eat:

                          opacity.append("1")

                      else:

                          opacity.append("0")


                  opacity = ";".join(opacity)


                  svg.append(

                      f'<rect '

                      f'x="{px}" '

                      f'y="{py}" '

                      f'width="{SIZE}" '

                      f'height="{SIZE}" '

                      f'rx="2" '

                      f'fill="{food_color}" '

                      f'filter="url(#glow)" '

                      f'opacity="0">'

                  )


                  svg.append(

                      f'<animate '

                      f'attributeName="opacity" '

                      f'dur="{DURATION}s" '

                      f'repeatCount="indefinite" '

                      f'values="{opacity}" '

                      f'keyTimes="{KEYTIMES}" '

                      f'calcMode="discrete"/>'

                  )


                  svg.append(

                      '</rect>'

                  )


              # ==================================================
              # SNAKE
              # ==================================================

              max_length = max(

                  len(state)

                  for state in states

              )


              for segment in range(max_length):


                  xs = []

                  ys = []

                  opacities = []


                  for state in states:


                      if segment < len(state):


                          sx, sy = state[segment]


                          xs.append(

                              LEFT + sx * CELL - 1

                          )


                          ys.append(

                              TOP + sy * CELL - 1

                          )


                          opacities.append("1")


                      else:


                          xs.append(-100)

                          ys.append(-100)

                          opacities.append("0")


                  # ------------------------------------------------
                  # HEAD
                  # ------------------------------------------------

                  if segment == 0:

                      fill = snake_head

                      width = 12

                      height = 12

                      rx = 4

                      glow = ' filter="url(#glow)"'


                  # ------------------------------------------------
                  # BODY
                  # ------------------------------------------------

                  elif segment % 2:

                      fill = snake_body

                      width = 10

                      height = 10

                      rx = 2

                      glow = ""


                  else:

                      fill = snake_dark

                      width = 10

                      height = 10

                      rx = 2

                      glow = ""


                  svg.append(

                      f'<rect '

                      f'x="{xs[0]}" '

                      f'y="{ys[0]}" '

                      f'width="{width}" '

                      f'height="{height}" '

                      f'rx="{rx}" '

                      f'fill="{fill}"'

                      f'{glow}>'

                  )


                  # ------------------------------------------------
                  # X ANIMATION
                  # ------------------------------------------------

                  svg.append(

                      f'<animate '

                      f'attributeName="x" '

                      f'dur="{DURATION}s" '

                      f'repeatCount="indefinite" '

                      f'values="{values(xs)}" '

                      f'keyTimes="{KEYTIMES}" '

                      f'calcMode="discrete"/>'

                  )


                  # ------------------------------------------------
                  # Y ANIMATION
                  # ------------------------------------------------

                  svg.append(

                      f'<animate '

                      f'attributeName="y" '

                      f'dur="{DURATION}s" '

                      f'repeatCount="indefinite" '

                      f'values="{values(ys)}" '

                      f'keyTimes="{KEYTIMES}" '

                      f'calcMode="discrete"/>'

                  )


                  # ------------------------------------------------
                  # OPACITY
                  # ------------------------------------------------

                  svg.append(

                      f'<animate '

                      f'attributeName="opacity" '

                      f'dur="{DURATION}s" '

                      f'repeatCount="indefinite" '

                      f'values="{";".join(opacities)}" '

                      f'keyTimes="{KEYTIMES}" '

                      f'calcMode="discrete"/>'

                  )


                  svg.append(

                      '</rect>'

                  )


              # --------------------------------------------------
              # SVG END
              # --------------------------------------------------

              svg.append(

                  '</svg>'

              )


              Path(filename).write_text(

                  "\n".join(svg),

                  encoding="utf-8"

              )


          # ======================================================
          # OUTPUT
          # ======================================================

          Path("dist").mkdir(
              exist_ok=True
          )


          generate(

              "light",

              "dist/github-contribution-grid-snake.svg"

          )


          generate(

              "dark",

              "dist/github-contribution-grid-snake-dark.svg"

          )


          print(
              "Custom contribution snake generated."
          )

          PY


      # ----------------------------------------------------------
      # PUBLISH
      # ----------------------------------------------------------

      - name: Publish to output branch
        shell: bash
        run: |

          cp \
            dist/github-contribution-grid-snake.svg \
            /tmp/github-contribution-grid-snake.svg

          cp \
            dist/github-contribution-grid-snake-dark.svg \
            /tmp/github-contribution-grid-snake-dark.svg


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git fetch origin output || true


          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/output
          then

            git checkout -B output origin/output

          else

            git checkout --orphan output

            git rm -rf . || true

          fi


          cp \
            /tmp/github-contribution-grid-snake.svg \
            github-contribution-grid-snake.svg


          cp \
            /tmp/github-contribution-grid-snake-dark.svg \
            github-contribution-grid-snake-dark.svg


          git add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg


          git commit \
            -m "Update custom snake animation" \
            || echo "No changes"


          git push \
            origin output
